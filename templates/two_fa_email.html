<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Your gooava sign-in code</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        line-height: 1.6;
        color: #333;
      }
      .container {
        max-width: 600px;
        margin: 0 auto;
        padding: 20px;
      }
      .header {
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        color: white;
        padding: 30px;
        text-align: center;
        border-radius: 10px 10px 0 0;
      }
      .content {
        background: #f9f9f9;
        padding: 30px;
        border-radius: 0 0 10px 10px;
      }
      .button {
        display: block;
        color: #667eea;
        margin: 20px 0;
      }
      a.button,
      a.button:hover,
      a.button:visited {
        color: #667eea;
      }
      .footer {
        text-align: center;
        margin-top: 30px;
        color: #666;
        font-size: 14px;
      }
      .fs-code {
        background-color: #667eea;
        color: white;
        font-size: 3rem;
        font-weight: bold;
        margin: 20px auto;
        padding: 16px;
        border-radius: 10px;
        display: inline-block;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="header">
        <h1>🔐 Sign-in code</h1>
      </div>
      <div class="content">
        <h2>Hi {{.FirstName}}!</h2>
        <p>
          Two-factor authentication is on for your account. Enter the code
          below to finish signing in.
        </p>

        <p class="fs-code">{{.VerificationCode}}</p>

        <a href="{{.BaseURL}}" class="button">Back to gooava</a>

        <p>
          If you didn't try to sign in, someone else may have your password —
          change it as soon as you can.
        </p>
      </div>
      <div class="footer">
        <p>Stay secure! ❤️</p>
      </div>
    </div>
  </body>
</html>
